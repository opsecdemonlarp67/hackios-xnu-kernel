#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
# cupid's own UEFI core (from uefi.img) lives at 0xA7000000 in a 4 MB region;
# its memory map has "UEFI FD" 0xA7000000+0x400000 and "UEFI FD Reserved"
# 0xA7400000+0x200000.  Keep the same layout.
#
[uefi_fd]
base = 0xA7000000
size = 0x400000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
[boot_image]
header_version = 4
