# Boot image parameters for the Xiaomi 12 (cupid), read by mkxnuimg.py.
# The UEFI FD lives at 0xA7000000 in a 4 MB region, as in the phone's own UEFI
# memory map; the XNUP payload starts at 0xF4600000, the beginning of the
# second usable DRAM chunk (the first ends at 0xEA000000, with a hole after it).
uefi_pkg=cupidPkg
fd_base=0xA7000000
fd_size=0x400000
payload_base=0xF4600000
payload_max=0x04000000
dtb=cupid.dtb
output=xnu-cupid.img
