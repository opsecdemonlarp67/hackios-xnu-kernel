# Boot image parameters for the POCO X5 Pro (redwood), read by mkxnuimg.py.
# The UEFI FD is placed by BootShim at fd_base and must be exactly fd_size long;
# the XNUP payload (loader + files) goes to payload_base.
uefi_pkg=redwoodPkg
fd_base=0x9FD00000
fd_size=0x200000
payload_base=0xF0000000
payload_max=0x04000000
dtb=redwood.dtb
output=xnu-redwood.img
